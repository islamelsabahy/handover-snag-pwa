name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/test_snag.js
      - name: Syntax-check browser code
        run: |
          for f in docs/app.js docs/snag.js docs/templates.js docs/sw.js; do node --check "$f"; done
